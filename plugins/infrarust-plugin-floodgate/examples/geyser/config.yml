# Example GeyserMC Standalone config for the Floodgate MVP.
#   Bedrock client -> Geyser (this file) -> Infrarust (client_only) -> Fabric backend
#
# The option names and nesting below were checked against Geyser's current v4 default
# config sample. Compare with the config generated by the exact Geyser release you run.
# Source: https://github.com/GeyserMC/Geyser/blob/master/core/src/test/resources/configuration/tests/v4default.yml
#
# Never commit the real Floodgate key file. Keep it outside the repo.

bedrock:
  # Address and port Bedrock clients connect to.
  address: 0.0.0.0
  port: 19132
  clone-remote-port: false
  motd1: "REPLACE-Bedrock MOTD line 1"
  motd2: "REPLACE-Bedrock MOTD line 2"

remote:
  # Where Geyser connects as a Java client. This is the INFRARUST bind address,
  # not the Fabric backend. Use the private overlay/service IP here.
  address: REPLACE-10.66.0.2
  port: 25565
  # Must be `floodgate` so Geyser attaches the Floodgate login data.
  auth-type: floodgate
  # Infrarust has receive_proxy_protocol = false, so this must stay false.
  use-proxy-protocol: false
  # Pass the Bedrock client's requested hostname through to Infrarust so its `domains`
  # entry selects the intended backend. Keep the routed hostname short for beta.4's
  # 255-character handshake limit.
  forward-hostname: true

# Floodgate shared key. Geyser reads this file. The same 16-byte key must be
# mounted read-only into Infrarust (see examples/infrarust/infrarust.toml).
# The path is a placeholder. Keep the file permissions tight (owner read only).
floodgate-key-file: REPLACE-/path/outside/repo/key.pem

# Show the proxy's MOTD and player counts to Bedrock clients. Leave off unless you
# want Infrarust's status to appear on Bedrock.
passthrough-motd: true
passthrough-player-counts: true
